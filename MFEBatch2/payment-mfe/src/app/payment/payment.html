<div class="payment-page">

  <div class="payment-card">

    <h1>Payment</h1>

    <p class="subtitle">
      Complete your order securely
    </p>

    <div class="amount-box">
      <span class="amount-label">
        Order Amount
      </span>

      <div class="amount">
        ₹{{ amount }}
      </div>
    </div>

    <div class="form-group">
      <label>Card Number</label>

      <input
        type="text"
        [(ngModel)]="cardNumber"
        placeholder="Enter card number"
        maxlength="16"
      />
    </div>

    <div class="form-group">
      <label>Card Holder Name</label>

      <input
        type="text"
        [(ngModel)]="cardHolderName"
        placeholder="Enter card holder name"
      />
    </div>

    <div class="card-row">

      <div class="form-group">
        <label>Expiry Date</label>

        <input
          type="text"
          [(ngModel)]="expiryDate"
          placeholder="MM/YY"
        />
      </div>

      <div class="form-group">
        <label>CVV</label>

        <input
          type="password"
          [(ngModel)]="cvv"
          maxlength="3"
          placeholder="CVV"
        />
      </div>

    </div>

    <button
      class="pay-button"
      (click)="makePayment()"
    >
      Pay ₹{{ amount }}
    </button>

  </div>

</div>
